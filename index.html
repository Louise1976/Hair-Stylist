<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hairstylist Books</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#6b7280; --green:#15803d; --red:#b91c1c; --blue:#1d4ed8; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#1d2330; color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header h1 { font-size:18px; margin:0; }
  select, input, button, textarea { font:inherit; }
  select { padding:6px; border-radius:6px; border:none; }
  main { max-width:820px; margin:0 auto; padding:16px; }
  .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .card { background:var(--card); border-radius:10px; padding:12px; border:1px solid var(--line); }
  .card small { color:var(--muted); display:block; }
  .card strong { font-size:20px; }
  .in strong { color:var(--green); } .out strong { color:var(--red); } .profit strong { color:var(--blue); }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:16px; }
  h2 { font-size:16px; margin:0 0 10px; }
  form { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  form .full { grid-column:1 / -1; }
  label { font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  input, select.f, textarea { padding:9px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); }
  .toggle { display:flex; gap:8px; }
  .toggle label { flex-direction:row; align-items:center; color:var(--ink); }
  button { padding:10px 14px; border:none; border-radius:8px; background:var(--blue); color:#fff; cursor:pointer; }
  button.ghost { background:#e5e7eb; color:var(--ink); }
  button.danger { background:var(--red); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
  td.num { text-align:right; white-space:nowrap; }
  .pos { color:var(--green); } .neg { color:var(--red); }
  img.thumb { width:44px; height:44px; object-fit:cover; border-radius:6px; cursor:pointer; border:1px solid var(--line); }
  .tag { font-size:11px; background:#eef2ff; color:#3730a3; padding:2px 6px; border-radius:4px; }
  .muted { color:var(--muted); font-size:13px; }
  dialog { border:none; border-radius:10px; padding:0; max-width:95vw; }
  dialog img { max-width:95vw; max-height:85vh; display:block; }
  dialog button { position:absolute; top:8px; right:8px; }
  @media (max-width:600px){ form{grid-template-columns:1fr;} .cards{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header>
  <h1>Hairstylist Books</h1>
  <div class="row">
    <label style="color:#fff;font-size:13px">Tax year
      <select id="year"></select>
    </label>
    <button class="ghost" onclick="exportCSV()">Export CSV</button>
    <button class="ghost" onclick="exportBackup()">Backup</button>
    <label class="ghost" style="padding:10px 14px;border-radius:8px;cursor:pointer;background:#e5e7eb;color:#1d2330;font-size:14px">
      Restore<input type="file" accept="application/json" onchange="importBackup(event)" hidden>
    </label>
    <label class="ghost" style="padding:10px 14px;border-radius:8px;cursor:pointer;background:#e5e7eb;color:#1d2330;font-size:14px">
      Import CSV<input type="file" accept=".csv,text/csv" onchange="importCSV(event)" hidden>
    </label>
  </div>
</header>

<main>
  <div class="cards">
    <div class="card in"><small>Income</small><strong id="tIn">£0.00</strong></div>
    <div class="card out"><small>Expenses</small><strong id="tOut">£0.00</strong></div>
    <div class="card profit"><small>Profit</small><strong id="tProfit">£0.00</strong></div>
  </div>

  <section>
    <h2>Add entry</h2>
    <form id="f" onsubmit="addEntry(event)">
      <div class="full toggle">
        <label><input type="radio" name="type" value="in"> Money in</label>
        <label><input type="radio" name="type" value="out" checked> Money out</label>
      </div>
      <label>Date<input type="date" name="date" required></label>
      <label>Amount (£)<input type="number" name="amount" step="0.01" min="0" required inputmode="decimal"></label>
      <label>Category
        <select name="category" class="f" id="cat"></select>
      </label>
      <label>Supplier / customer<input type="text" name="party" placeholder="e.g. Wella Professionals"></label>
      <label class="full">Description<input type="text" name="desc" placeholder="e.g. Colour for Mrs Smith, Saturday"></label>
      <label>VAT (£, optional)<input type="number" name="vat" step="0.01" min="0" inputmode="decimal"></label>
      <label>Payment
        <select name="pay" class="f">
          <option>Card</option><option>Bank transfer</option><option>Cash</option><option>Cheque</option><option>Other</option>
        </select>
      </label>
      <label class="full">Receipt or ledger photo
        <input type="file" name="photo" accept="image/*" capture="environment" id="photo">
      </label>
      <div class="full row">
        <button type="submit">Save entry</button>
        <span class="muted" id="saveMsg"></span>
      </div>
    </form>
  </section>

  <section>
    <h2>Entries</h2>
    <div class="row" style="margin-bottom:10px">
      <select id="filter" class="f" onchange="render()">
        <option value="all">All</option><option value="in">Money in</option><option value="out">Money out</option>
      </select>
      <span class="muted" id="count"></span>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Date</th><th>Details</th><th>Category</th><th>Photo</th><th class="num">Amount</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>Quick summary by category</h2>
    <table><tbody id="summary"></tbody></table>
  </section>
</main>

<dialog id="viewer"><button class="ghost" onclick="viewer.close()">✕</button><img id="viewImg" alt="Receipt"></dialog>

<script>
// Categories follow the HMRC self-employment (SA103) headings so the accountant can use them directly.
const CATS_OUT = [
  "Hair products & colour", "Stock & retail products", "Salon or chair rent",
  "Tools & equipment (scissors, dryers)", "Training & courses", "Uniform & gowns",
  "Insurance (public liability, etc.)", "Phone & internet", "Booking & software subscriptions",
  "Accountancy & professional fees", "Bank & card charges", "Marketing & website",
  "Cleaning & laundry", "Travel (business mileage)", "Vehicle running costs",
  "Other business expense"
];
const CATS_IN = ["Client services", "Product sales", "Tips", "Other income"];
const KEY = "hairstylistBooks.v1";
let data = load();
let viewer = document.getElementById("viewer");

// Build the tax-year picker (UK tax year runs 6 April to 5 April)
function taxYearOf(dateStr){
  const d = new Date(dateStr + "T12:00:00");
  const y = d.getFullYear();
  const cutoff = new Date(y, 3, 6, 12);
  const start = d >= cutoff ? y : y - 1;
  return start;
}
function yearLabel(start){ return `6 Apr ${start} – 5 Apr ${start+1}`; }
function currentTaxYear(){ return taxYearOf(new Date().toISOString().slice(0,10)); }

function fillYears(){
  const ys = new Set([currentTaxYear()]);
  data.forEach(e => ys.add(taxYearOf(e.date)));
  const sel = document.getElementById("year");
  const prev = sel.value;
  sel.innerHTML = [...ys].sort((a,b)=>b-a).map(y=>`<option value="${y}">${yearLabel(y)}</option>`).join("");
  if (prev && ys.has(+prev)) sel.value = prev;
}

function fillCats(){
  const sel = document.getElementById("cat");
  const typeIn = document.querySelector('input[name=type]:checked').value === "in";
  sel.innerHTML = (typeIn ? CATS_IN : CATS_OUT).map(c=>`<option>${c}</option>`).join("");
}
document.querySelectorAll('input[name=type]').forEach(r=>r.addEventListener("change", fillCats));

function money(n){ return "£" + (Number(n)||0).toFixed(2); }
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } }
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(data)); }
  catch(e){ alert("Storage is full. Export a backup and delete old photos, or use smaller photos."); }
}

// Shrink photos so many receipts fit in local storage
function shrinkImage(file){
  return new Promise((resolve)=>{
    if (!file) return resolve(null);
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const max = 1200;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = ()=>resolve(null);
    img.src = url;
  });
}

async function addEntry(ev){
  ev.preventDefault();
  const f = ev.target;
  const btn = f.querySelector("button[type=submit]");
  btn.disabled = true;
  document.getElementById("saveMsg").textContent = "Saving…";
  const photoFile = f.photo.files[0];
  const photo = await shrinkImage(photoFile);
  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    type: f.type.value,
    date: f.date.value,
    amount: parseFloat(f.amount.value) || 0,
    vat: parseFloat(f.vat.value) || 0,
    category: f.category.value,
    party: f.party.value.trim(),
    desc: f.desc.value.trim(),
    pay: f.pay.value,
    photo: photo
  };
  data.push(entry);
  save();
  f.reset();
  f.date.value = new Date().toISOString().slice(0,10);
  f.type.value = "out";
  fillCats();
  btn.disabled = false;
  document.getElementById("saveMsg").textContent = "Saved ✓";
  setTimeout(()=>document.getElementById("saveMsg").textContent="", 2000);
  fillYears();
  render();
}

function deleteEntry(id){
  if (!confirm("Delete this entry and its photo?")) return;
  data = data.filter(e=>e.id !== id);
  save(); fillYears(); render();
}

function viewPhoto(id){
  const e = data.find(x=>x.id===id);
  if (!e || !e.photo) return;
  document.getElementById("viewImg").src = e.photo;
  viewer.showModal();
}

function inYear(e){ return taxYearOf(e.date) === +document.getElementById("year").value; }

function render(){
  const year = +document.getElementById("year").value;
  const filter = document.getElementById("filter").value;
  const list = data.filter(inYear).sort((a,b)=> a.date < b.date ? 1 : -1);

  const tin = list.filter(e=>e.type==="in").reduce((s,e)=>s+e.amount,0);
  const tout = list.filter(e=>e.type==="out").reduce((s,e)=>s+e.amount,0);
  document.getElementById("tIn").textContent = money(tin);
  document.getElementById("tOut").textContent = money(tout);
  const p = tin - tout;
  const pe = document.getElementById("tProfit");
  pe.textContent = money(p);
  pe.style.color = p < 0 ? "var(--red)" : "";

  const shown = list.filter(e => filter==="all" || e.type===filter);
  document.getElementById("count").textContent = `${shown.length} entr${shown.length===1?"y":"ies"} in ${yearLabel(year)}`;
  document.getElementById("rows").innerHTML = shown.length ? shown.map(e=>`
    <tr>
      <td>${fmtDate(e.date)}</td>
      <td>${escapeHTML(e.party || "—")}<br><span class="muted">${escapeHTML(e.desc)}</span>${e.vat?`<br><span class="muted">VAT ${money(e.vat)}</span>`:""}</td>
      <td><span class="tag">${escapeHTML(e.category)}</span></td>
      <td>${e.photo ? `<img class="thumb" src="${e.photo}" onclick="viewPhoto('${e.id}')" alt="receipt">` : ""}</td>
      <td class="num ${e.type==="in"?"pos":"neg"}">${e.type==="in"?"+":"−"}${money(e.amount)}</td>
      <td><button class="ghost" onclick="deleteEntry('${e.id}')">Delete</button></td>
    </tr>`).join("") : `<tr><td colspan="6" class="muted">No entries for this tax year yet.</td></tr>`;

  const byCat = {};
  list.forEach(e => { const k = (e.type==="in"?"IN: ":"") + e.category; byCat[k] = (byCat[k]||0) + e.amount; });
  const keys = Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
  document.getElementById("summary").innerHTML = keys.length
    ? keys.map(k=>`<tr><td>${escapeHTML(k)}</td><td class="num">${money(byCat[k])}</td></tr>`).join("")
    : `<tr><td class="muted">Nothing to summarise yet.</td></tr>`;
}

function escapeHTML(s){ return String(s??"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function csvCell(v){ const s = String(v??""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }

function exportCSV(){
  const year = +document.getElementById("year").value;
  const list = data.filter(inYear).sort((a,b)=> a.date < b.date ? -1 : 1);
  const head = ["Date","Type","Category","Supplier/Customer","Description","Amount (GBP)","VAT (GBP)","Payment","Receipt photo"];
  const lines = [head.join(",")];
  list.forEach((e,i)=>{
    const photoName = e.photo ? `receipt_${e.date}_${i+1}.jpg` : "";
    lines.push([e.date, e.type==="in"?"Income":"Expense", e.category, e.party, e.desc, e.amount.toFixed(2), e.vat?e.vat.toFixed(2):"", e.pay, photoName].map(csvCell).join(","));
  });
  const tin = list.filter(e=>e.type==="in").reduce((s,e)=>s+e.amount,0);
  const tout = list.filter(e=>e.type==="out").reduce((s,e)=>s+e.amount,0);
  lines.push("");
  lines.push(`,,,,Total income,${tin.toFixed(2)}`);
  lines.push(`,,,,Total expenses,${tout.toFixed(2)}`);
  lines.push(`,,,,Profit,${(tin-tout).toFixed(2)}`);
  download(`hairstylist-${year}-${year+1}.csv`, "\ufeff" + lines.join("\n"), "text/csv");

  // Receipt photos download separately, numbered to match the CSV
  list.forEach((e,i)=>{ if (e.photo) setTimeout(()=>{ const a=document.createElement("a"); a.href=e.photo; a.download=`receipt_${e.date}_${i+1}.jpg`; a.click(); }, 300*i); });
}

function exportBackup(){
  download(`hairstylist-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(data), "application/json");
}
function importBackup(ev){
  const file = ev.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try {
      const incoming = JSON.parse(r.result);
      if (!Array.isArray(incoming)) throw new Error();
      const ids = new Set(data.map(e=>e.id));
      incoming.forEach(e=>{ if (!ids.has(e.id)) data.push(e); });
      save(); fillYears(); render();
      alert(`Restored. ${incoming.length} entries checked.`);
    } catch(e){ alert("That backup file could not be read."); }
  };
  r.readAsText(file);
}

// Reads a CSV in the format produced by the spreadsheet: Date,Type,Category,Supplier/Customer,Description,Amount (GBP),Notes
function parseCSV(text){
  const rows = [];
  let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"' && text[i+1] === '"'){ field += '"'; i++; }
      else if (c === '"') q = false;
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(field); field = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function importCSV(ev){
  const file = ev.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try {
      const rows = parseCSV(String(r.result).replace(/^﻿/, ""))
        .filter(x => x.length >= 6 && /^\d{4}-\d{2}-\d{2}$/.test(x[0]));
      let added = 0, skipped = 0;
      rows.forEach(x => {
        const [date, typeTxt, catTxt, party, desc, amountTxt, notes] = x;
        const amount = parseFloat(amountTxt);
        if (!amount) { skipped++; return; }
        const type = /income/i.test(typeTxt) ? "in" : "out";
        const allowed = type === "in" ? CATS_IN : CATS_OUT;
        const category = allowed.includes(catTxt) ? catTxt
          : (type === "in" ? "Other income" : "Other business expense");
        const description = [desc, notes].filter(Boolean).join(" - ");
        data.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2,8),
          type, date, amount, vat: 0, category,
          party: party || "", desc: description, pay: "Other", photo: null
        });
        added++;
      });
      save(); fillYears(); render();
      alert(`Imported ${added} entries.` + (skipped ? ` ${skipped} skipped (no amount).` : ""));
    } catch(e){ alert("That CSV file could not be read."); }
  };
  r.readAsText(file);
  ev.target.value = "";
}

function download(name, text, type){
  const blob = new Blob([text], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

// Init
document.querySelector('input[name=date]').value = new Date().toISOString().slice(0,10);
fillCats(); fillYears(); render();
document.getElementById("year").addEventListener("change", render);
document.getElementById("photo").addEventListener("change", readReceipt);

// UK date format: day/month/year
function fmtDate(iso){
  const [y, m, d] = String(iso).split("-");
  return `${d}/${m}/${y}`;
}

// Loads the OCR library only when a receipt is photographed
function loadScript(src){
  return new Promise((resolve, reject)=>{
    if (window.Tesseract) return resolve();
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

// Pulls a date and total from receipt text. Assumes UK order (day first).
function parseReceipt(text){
  let date = null;
  const dm = text.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})\b/);
  if (dm){
    let d = +dm[1], mo = +dm[2], y = +dm[3];
    if (y < 100) y += 2000;
    if (mo > 12){ [d, mo] = [mo, d]; }
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31){
      date = `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    }
  }
  const amtRe = /£?\s?(\d{1,4}[.,]\d{2})\b/g;
  let amount = null;
  for (const line of text.split(/\n/)){
    if (/total|amount due|to pay|balance/i.test(line) && !/sub\s*-?\s*total/i.test(line)){
      const all = [...line.matchAll(amtRe)];
      if (all.length) amount = parseFloat(all[all.length-1][1].replace(",", "."));
    }
  }
  if (amount == null){
    const all = [...text.matchAll(amtRe)].map(m => parseFloat(m[1].replace(",", ".")));
    if (all.length) amount = Math.max(...all);
  }
  return { date, amount };
}

// Reads the photographed receipt and fills in the amount and date. The user checks them before saving.
async function readReceipt(ev){
  const file = ev.target.files[0];
  const msg = document.getElementById("saveMsg");
  if (!file) return;
  msg.textContent = "Reading receipt… this can take 20 seconds";
  try {
    await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
    const res = await Tesseract.recognize(file, "eng");
    const { date, amount } = parseReceipt(res.data.text);
    const f = document.getElementById("f");
    if (date) f.date.value = date;
    if (amount != null) f.amount.value = amount.toFixed(2);
    msg.textContent = (date || amount != null)
      ? "Filled in from receipt. Please check the date and amount before saving."
      : "Could not read the receipt. Please type the date and amount.";
  } catch(e){
    msg.textContent = "Could not read the receipt. Please type the date and amount.";
  }
}
</script>
</body>
</html>
